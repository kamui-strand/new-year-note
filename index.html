<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy New Year 🎆</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    #tapButton {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #ff4d6d;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    #tapButton:active { transform: scale(0.95); }

    #card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 320px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transform: scale(0);
      opacity: 0;
      transition: all 0.6s ease;
      position: relative;
      z-index: 2;
    }
    #card.show {
      transform: scale(1);
      opacity: 1;
    }

    h1 { color: #ff4d6d; }
    p { color: #444; line-height: 1.6; }

    .stickers {
      margin-top: 20px;
    }
    .sticker {
      width: 60px;
      margin: 5px;
      animation: float 3s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #fff;
      top: -10px;
      opacity: 0.8;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

<button id="tapButton">Tap to Open 💖</button>

<div id="card">
  <h1>Happy New Year 🎆</h1>
  <p>Hoi 💮</p>
  <p>Happy new year Yasu</p>
  <p id="message"></p>

  <div class="stickers">
    <img src="Sticker1png.jpg" class="sticker">
    <img src="Sticker2png.jpg" class="sticker">
    <img src="Sticker3png.jpg" class="sticker">
  </div>
</div>

<audio id="music" loop>
  <source src="co2.mp3" type="audio/mpeg">
</audio>

<script>
  const button = document.getElementById('tapButton');
  const card = document.getElementById('card');
  const music = document.getElementById('music');
  const stickers = document.querySelectorAll('.sticker');
  const messageEl = document.getElementById('message');

  const messageText = `I didn't wanted this year to be ended like this
But man I am such a dumbass
But I pray 2026 and the rest all years be the best ones for you and your family.
May you always be happy everywhere 💝
And achieve your dreams 🫡
Barakallahu Feek ✨
Buii`;

  function typeMessage(text, el, delay=50) {
    let i = 0;
    function type() {
      if (i < text.length) {
        el.innerHTML += text[i] === '\n' ? '<br>' : text[i];
        i++;
        setTimeout(type, delay);
      }
    }
    type();
  }

  function animateStickers() {
    stickers.forEach((sticker, index) => {
      setTimeout(() => { sticker.style.opacity = 1; }, index * 300);
    });
  }

  function createConfetti(count=30) {
    for (let i=0;i<count;i++) {
      const c = document.createElement('div');
      c.classList.add('confetti');
      c.style.left = Math.random() * window.innerWidth + 'px';
      c.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 60%)`;
      document.body.appendChild(c);
      fall(c);
    }
  }

  function fall(el) {
    let top = -10;
    const speed = 2 + Math.random() * 3;
    const left = parseFloat(el.style.left);
    function drop() {
      top += speed;
      el.style.top = top + 'px';
      if (top < window.innerHeight) requestAnimationFrame(drop);
      else el.remove();
    }
    drop();
  }

  button.addEventListener('click', () => {
    card.classList.add('show');
    music.play();
    button.style.display = 'none';
    typeMessage(messageText, messageEl);
    animateStickers();
    createConfetti(50);
  });
</script>

</body>
</html>
