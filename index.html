<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy New Year ✨</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", sans-serif;
}

/* Animated aesthetic background */
body {
  background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
  background-size: 300% 300%;
  animation: bgMove 20s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Tap button */
#tap {
  padding: 20px 45px;
  font-size: 20px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  box-shadow: 0 0 25px rgba(255,75,75,.6);
  animation: glow 2s infinite;
  z-index: 5;
}

@keyframes glow {
  0%,100% { box-shadow: 0 0 25px rgba(255,75,75,.6); }
  50% { box-shadow: 0 0 45px rgba(255,75,75,1); }
}

/* Card */
#card {
  position: absolute;
  max-width: 360px;
  padding: 30px;
  background: rgba(255,255,255,.95);
  border-radius: 20px;
  box-shadow: 0 30px 60px rgba(0,0,0,.4);
  text-align: center;
  transform: scale(0);
  opacity: 0;
  transition: .6s ease;
  z-index: 4;
}

#card.show {
  transform: scale(1);
  opacity: 1;
}

h1 {
  margin-top: 0;
  color: #ff416c;
}

p {
  color: #333;
  line-height: 1.6;
}

/* Floating particles */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255,255,255,.6);
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
}

/* Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: .8;
}
</style>
</head>

<body>

<button id="tap">Tap to Open 🎉</button>

<div id="card">
  <h1>Happy New Year 🎆</h1>
  <p>Hoi 💮</p>
  <p id="msg"></p>
</div>

<audio id="music" loop>
  <source src="co2.mp3" type="audio/mpeg">
</audio>

<script>
const tap = document.getElementById("tap");
const card = document.getElementById("card");
const music = document.getElementById("music");
const msg = document.getElementById("msg");

const text = `Happy new year yasu
I didn't wanted this year to be ended like this
But man I am such a dumbass
But I pray 2026 and the rest all years be the best ones for you and your family.
May you always be happy everywhere 💝
And achieve your dreams 🫡
Barakallahu Feek ✨
Buii`;

function typeText() {
  let i = 0;
  const timer = setInterval(() => {
    if (i < text.length) {
      msg.innerHTML += text[i] === "\n" ? "<br>" : text[i];
      i++;
    } else {
      clearInterval(timer);
    }
  }, 45);
}

/* Particles */
function particle() {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random()*innerWidth + "px";
  p.style.top = innerHeight + "px";
  document.body.appendChild(p);

  let y = innerHeight;
  const rise = setInterval(() => {
    y -= 0.5;
    p.style.top = y + "px";
    p.style.opacity = y / innerHeight;
    if (y < -10) {
      clearInterval(rise);
      p.remove();
    }
  }, 10);
}

/* Stars */
function star() {
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random()*innerWidth + "px";
  s.style.top = "-5px";
  document.body.appendChild(s);

  let y = -5;
  const fall = setInterval(() => {
    y += 1;
    s.style.top = y + "px";
    if (y > innerHeight) {
      clearInterval(fall);
      s.remove();
    }
  }, 16);
}

tap.onclick = () => {
  tap.style.display = "none";
  card.classList.add("show");
  music.play();
  typeText();
  setInterval(particle, 200);
  setInterval(star, 150);
};
</script>

</body>
</html>
